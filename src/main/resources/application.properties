# src/main/resources/application.properties

spring.application.name=SmartHire

# Server Port (Render sets PORT environment variable)
server.port=${PORT:8080}

# MySQL Database (Aiven / Render Environment Variables)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&verifyServerCertificate=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Connection Pool Settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Continue on error for debugging
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.sql.init.mode=always

# File Upload (Resumes)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Email (Gmail SMTP with App Password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:cse.takeoff@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:digkagfgyxcjltup}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Custom App Properties (FOR GEMINI & FRONTEND)
app.gemini.api-key=${GEMINI_API_KEY:AIzaSyAs9q7d_I16QT8kvSZqWW1tPbr-8WzRAgA}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Static Resources (Optional)
spring.web.resources.static-locations[0]=file:src/main/resources/static/