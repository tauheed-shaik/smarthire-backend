# Failover profile for when database is not available
spring.profiles.active=failover

# Use H2 in-memory database as fallback
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

# Disable JPA auto-creation to avoid errors
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Basic logging
logging.level.org.springframework=INFO
logging.level.com.project.smart_hire=DEBUG

# Keep other settings
server.port=${PORT:8080}
spring.application.name=SmartHire-Failover
